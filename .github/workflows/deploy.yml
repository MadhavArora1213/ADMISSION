name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PHP_VERSION: '8.2'

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── LINT & VALIDATE ───
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: PHP Lint
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" | xargs -n 1 php -l 2>&1 | grep -v "No syntax errors"

      - name: Check for debug statements
        run: |
          if grep -rn "var_dump\|print_r\|error_log.*DEBUG\|dd(" --include="*.php" . 2>/dev/null | grep -v "admin/" | grep -v "api/"; then
            echo "WARNING: Found debug statements in production code"
          fi

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "password.*=.*['\"].*['\"]" --include="*.php" . 2>/dev/null | grep -v "db.php" | grep -v ".env" | grep -v "config.php" | grep -v "example"; then
            echo "WARNING: Possible hardcoded passwords found"
          fi

  # ─── SECURITY SCAN ───
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for exposed .env
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: .env file found in repo!"
            exit 1
          fi

      - name: Check for SQL files in uploads
        run: |
          if find uploads/ -name "*.sql" 2>/dev/null | grep -q .; then
            echo "WARNING: SQL files found in uploads directory"
          fi

      - name: Verify .gitignore
        run: |
          grep -q "\.env" .gitignore && echo ".env is in .gitignore" || echo "WARNING: .env not in .gitignore"
          grep -q "\.env\.production" .gitignore && echo ".env.production is in .gitignore" || echo "WARNING: .env.production not in .gitignore"

  # ─── BUILD & DEPLOY ───
  deploy:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Generate deployment artifact
        run: |
          mkdir -p deploy-build
          # Copy all files except dev/CI stuff
          rsync -av --progress \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.mimocode' \
            --exclude='*.md' \
            --exclude='diff.txt' \
            --exclude='fix_sql_for_hostinger.ps1' \
            --exclude='test_full.html' \
            --exclude='nimhans.html' \
            --exclude='temp_index.html' \
            --exclude='out.html' \
            --exclude='h.html' \
            --exclude='DEPLOY.txt' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            . deploy-build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: admission-build-${{ github.sha }}
          path: deploy-build/
          retention-days: 7

      - name: Commit build metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Build ${{ github.sha }} at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .build-info
          git add -f .build-info
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update build info [skip ci]"
            for i in 1 2 3; do
              git pull origin main --rebase && git push && break
              echo "Attempt $i failed, retrying..."
              sleep 2
            done
          fi

  # ─── NOTIFY ───
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Pipeline passed — build artifact ready"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
          else
            echo "❌ Pipeline failed"
          fi
