<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2447"/>
      <stop offset="100%" style="stop-color:#19376D"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <g transform="translate(50,52) scale(0.9)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mortarboard top -->
    <polygon points="0,-28 40,-8 0,12 -40,-8" fill="#fff" opacity="0.95"/>
    <!-- Tassel line -->
    <line x1="0" y1="-8" x2="0" y2="16" stroke="#60a5fa" stroke-width="3"/>
    <!-- Tassel ball -->
    <circle cx="0" cy="18" r="4" fill="#60a5fa"/>
    <!-- Tassel string -->
    <path d="M 0 14 Q 8 20 4 28" stroke="#60a5fa" stroke-width="2.5" fill="none"/>
    <!-- Book/pages below -->
    <path d="M -18 6 L 0 0 L 18 6" stroke="#fff" stroke-width="4" fill="none" opacity="0.8"/>
    <line x1="-14" y1="12" x2="14" y2="12" stroke="#fff" stroke-width="3" opacity="0.6"/>
  </g>
</svg>